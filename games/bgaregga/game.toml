  { name = "rom4.bin", size = 2097152, crc32 = "b333d81f", sha1 = "5481465f1304334fd55798be2f44324c57c2dbcb" },
  { name = "rom3.bin", size = 2097152, crc32 = "51b9ebfb", sha1 = "30e0c326f5175aa436df8dba08f6f4e08130b92f" },
  { name = "rom2.bin", size = 2097152, crc32 = "b330e5e2", sha1 = "5d48e9d56f99d093b6390e0af1609fd796df2d35" },
  { name = "rom1.bin", size = 2097152, crc32 = "7eafdd70", sha1 = "7c8da8e86c3f9491719b1d7d5d285568d7614f38" },
  { name = "text.u81", size = 32768, crc32 = "e67fd534", sha1 = "987d0edffc2c243a13d4567319ea3d185eaadbf8" },
  { name = "snd.bin", size = 131072, crc32 = "68632952", sha1 = "fb834db83157948e2b420b6051102a9c6ac3969b" },
  { name = "rom5.bin", size = 1048576, crc32 = "f6d49863", sha1 = "3a3c354852adad06e8a051511abfab7606bce382" },
