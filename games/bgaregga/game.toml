# Battle Garegga (Europe / USA / Japan / Asia) (Sat Feb 3 1996), Raizing / Eighting.
# Only [content] is final: names, sizes and CRC-32s from FBNeo a836e52
# (src/burn/drv/toaplan/d_battleg.cpp, bgareggaRomDesc), SHA-1s from MAME 0.289
# (src/mame/toaplan/raizing.cpp), whose CRC-32 matches for every member (docs/roms.md,
# "Content tables"). The rest is a stub, so the config parses and the ROM audit can check the
# content, until G4 sets the orientation, buttons, reset and RAM variables.

core = "fbneo"
settle_frames = 1         # Toaplan GP9001 driver: verified (docs/games.md)
orientation = 0           # stub until G4

[content]
file = "bgaregga.zip"
members = [
