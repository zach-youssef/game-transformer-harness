# (src/burn/drv/pgm/d_pgm.cpp, ddp3blkRomDesc and the BIOS table it adds), SHA-1s from MAME
# 0.289 (src/mame/igs/pgm.cpp), whose CRC-32 matches for every member (docs/roms.md, "Content
# tables"). Not listed: ddp3_igs027a.bin, never dumped (NODUMP in both drivers, so no set
# holds it). The rest is a stub, so the config parses and the ROM audit can check the
# content, until G5 sets the orientation, buttons, reset and RAM variables.

