# Ketsui: Kizuna Jigoku Tachi (2003/01/01. Master Ver.), Cave (IGS PGM).
# Only [content] is final: names, sizes and CRC-32s from FBNeo a836e52
# (src/burn/drv/pgm/d_pgm.cpp, ketRomDesc and the BIOS table it adds), SHA-1s from MAME 0.289
# (src/mame/igs/pgm.cpp), whose CRC-32 matches for every member (docs/roms.md, "Content
# tables"). Not listed: ket_igs027a.bin, never dumped (NODUMP in both drivers, so no set
# holds it). The rest is a stub, so the config parses and the ROM audit can check the
# content, until G5 sets the orientation, buttons, reset and RAM variables.

core = "fbneo"
settle_frames = 1         # CAVE driver: verified (docs/games.md)
orientation = 0           # stub until G5

[content]
file = "ket.zip"
