  { name = "cave_a04701w064.u7", size = 8388608, crc32 = "5ef1b94b", sha1 = "f10dfa46e0a4d297c3a856aea5b49d648f98935c" },
  { name = "cave_a04702w064.u8", size = 8388608, crc32 = "26d6da7f", sha1 = "f20e07a7994f41b5ed917f8b0119dc5542f3541c" },
  { name = "cave_b04701w064.u1", size = 8388608, crc32 = "1bec008d", sha1 = "07d117dc2eebb35727fb18a7c563acbaf25a8d36" },
  { name = "cave_m04701b032.u17", size = 4194304, crc32 = "b46e22d1", sha1 = "670853dc485942fb96380568494bdf3235f446ee" },
