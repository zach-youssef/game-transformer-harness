# Gunbird (World), Psikyo.
# Only [content] is final: names, sizes and CRC-32s from FBNeo a836e52
# (src/burn/drv/psikyo/d_psikyo.cpp, gunbirdRomDesc), SHA-1s from MAME 0.289
# (src/mame/psikyo/psikyo.cpp), whose CRC-32 matches for every member (docs/roms.md, "Content
# tables"). Not listed: 3020.u19, 3021.u69, never dumped (NODUMP in both drivers, so no set
# holds them). The rest is a stub, so the config parses and the ROM audit can check the
# content, until G6 sets the orientation, buttons, reset and RAM variables.

core = "fbneo"
settle_frames = 1         # FBNeo dupes a fresh process's first frame: verified (docs/games.md)
orientation = 0           # stub until G6
sprite_hw = "psikyo"      # sprite-list labels (docs/recording-format.md, "Sprite labels")

