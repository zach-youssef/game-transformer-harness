# Human and random reference scores for the Atari games, the (low, high) of the human-normalised
# score: 100 x (agent - random) / (human - random) (docs/metrics.md, "Normalised scores"). Two
# published tables, each row citing the knowledge-base claim (~/code/research, kb/papers) that
# says the paper gives the table. The claims don't repeat the numbers: they are in the note's
# "Implementation notes" bullet for the table (badia2020agent57.md, "57-game table of average
# human and random scores", from App. H.4, p. 27; mnih2015human.md, "Per-game random and human
# reference scores", from Table 2, p. 11), as of research commit 7bd8a38:
#
# - badia2020agent57: Agent57's 57-game table (App. H.4, p. 27), the one most later work uses
#   (JOWA's Table 2 prints its values, cheng2025jointly#C20), with no source given for its
#   human scores. Covers all twelve games.
# - mnih2015human: DQN's 49-game table (Table 2, p. 11): a professional tester's average over
#   about 20 five-minute episodes (mnih2015human#C9) and a uniformly random action every sixth
#   frame (mnih2015human#C10). No Phoenix or Yars' Revenge. Its human scores differ from
#   Agent57's in 8 of the 10 games both have (Ms. Pac-Man 15693 against 6951.6); the random
#   scores are the same.
#
# Report which table a normalised score uses: they aren't interchangeable.

[atari-alien.badia2020agent57]  # Alien
random = 227.8
human = 7127.7
claim = "badia2020agent57#C10"

[atari-alien.mnih2015human]
random = 227.8
human = 6875.0
