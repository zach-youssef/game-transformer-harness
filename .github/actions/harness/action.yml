name: Harness
description: >-
  Installs the pinned Rust toolchain and uv, syncs uv.lock and builds gtharness into the venv,
  so later steps can run `uv run --locked gth ...`. Run after actions/checkout.
runs:
  using: composite
  steps:
    - name: Install the pinned Rust toolchain (rust-toolchain.toml)
      shell: bash
      run: rustup toolchain install

    # Third-party actions pinned by commit: this action runs in the cores workflow's jobs.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3

    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0, as in ci.yml: bump both
      with:
        version: "0.13.10"
        enable-cache: true

    - name: Build gtharness
      shell: bash
      env:
        PYO3_BUILD_EXTENSION_MODULE: "1"
      run: |
        uv sync --locked
        uv run --locked maturin develop --uv --locked
