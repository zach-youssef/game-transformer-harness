name: Cores

# Builds every core in cores.lock at its pinned commit for each platform and loads each build
# without a game (docs/cores.md). Only main publishes: a GitHub release named after the lock's
# sources (`gth cores plan`), once per tag. Branches upload workflow artifacts only.
on:
  push:
    # Every branch (paths alone would also skip tags); main publishes, others stop at stage.
    branches: ['**']
    paths:
      - cores.lock
      - scripts/build-core.sh
      - .github/workflows/cores.yml
      - .github/actions/harness/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cores-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      cores: ${{ steps.plan.outputs.cores }}
      released: ${{ steps.plan.outputs.released }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/harness
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plan=$(uv run --locked gth cores plan)
          tag=$(jq -r .tag <<<"$plan")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "cores=$(jq -c '[.cores[] | {name, repo, commit}]' <<<"$plan")" >> "$GITHUB_OUTPUT"
          # A tag's release is built once (docs/cores.md): on main, an existing one is checked
          # with `gth cores fetch` instead of rebuilt.
          if [ "$GITHUB_REF" = refs/heads/main ] && gh release view "$tag" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          echo "$plan" | jq .

  build:
    needs: plan
    if: needs.plan.outputs.released == 'false'
    name: build ${{ matrix.core.name }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJSON(needs.plan.outputs.cores) }}
        platform: [osx, unix, win]
        include:
          - platform: osx
            os: macos-latest  # Apple silicon
            target: aarch64-apple-darwin
          - platform: unix
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: win
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      NAME: ${{ matrix.core.name }}
      REPO: ${{ matrix.core.repo }}
      COMMIT: ${{ matrix.core.commit }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # Windows builds use upstream's route: the core's Makefile (CMake for ALE) under MSYS2
      # with MinGW-w64 gcc.
      - if: matrix.platform == 'win'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: MINGW64
          install: >-
            make git perl mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-zlib

      - if: matrix.platform == 'win'
        shell: msys2 {0}
        run: scripts/build-core.sh "$NAME" "$REPO" "$COMMIT" win build

      - if: matrix.platform != 'win'
        shell: bash
        run: scripts/build-core.sh "$NAME" "$REPO" "$COMMIT" "$PLATFORM" build

      - uses: actions/upload-artifact@v7
        with:
          name: core-${{ matrix.target }}-${{ matrix.core.name }}
          path: build/${{ matrix.core.name }}_libretro.*
          if-no-files-found: error

  # Loads each fresh build without a game (retro_init, retro_get_system_info, retro_deinit) on
  # its platform and checks its library_version. (A Windows DLL that imports MinGW's runtime
  # already failed its build: the runner has MinGW on PATH, so it would load here.)
  check:
    needs: build
    name: check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/harness
      - uses: actions/download-artifact@v8
        with:
          pattern: core-${{ matrix.target }}-*
          merge-multiple: true
          path: builds/${{ matrix.target }}
      - run: uv run --locked gth cores check "builds/${{ matrix.target }}"

  # Lays out the release from every platform's builds, with read-only permissions, on every
  # branch; the hashes go into the run log, which nothing can change later.
  stage:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/harness
      - uses: actions/download-artifact@v8
        with:
          pattern: core-aarch64-apple-darwin-*
          merge-multiple: true
          path: builds/aarch64-apple-darwin
      - uses: actions/download-artifact@v8
        with:
          pattern: core-x86_64-unknown-linux-gnu-*
          merge-multiple: true
          path: builds/x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@v8
        with:
          pattern: core-x86_64-pc-windows-msvc-*
          merge-multiple: true
          path: builds/x86_64-pc-windows-msvc
      - run: |
          uv run --locked gth cores release builds --out release \
            --target aarch64-apple-darwin \
            --target x86_64-unknown-linux-gnu \
            --target x86_64-pc-windows-msvc
          cat release/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/
          if-no-files-found: error

  # The only job that can write: no checkout, no harness and no third-party action, only the
  # staged files and `gh release create`.
  publish:
    needs: [plan, stage]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
          path: release
      - name: Publish ${{ needs.plan.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          cat release/SHA256SUMS
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Core builds for cores.lock at $GITHUB_SHA. Compare this release's cores.lock with SHA256SUMS in the run log, then commit it to main (docs/cores.md)."

  # On main, once a tag's release exists: fetch it on each platform, which checks the hashes
  # committed in cores.lock and the version each build reports.
  fetch:
    needs: plan
    if: needs.plan.outputs.released == 'true'
    name: fetch (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/harness
      - run: uv run --locked gth cores fetch "$RUNNER_TEMP/gth-data"
